<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boutique — TONAFA</title>
  <meta name="description" content="Découvrez toute la collection TONAFA — vêtements modernes inspirés de l'Afrique de l'Ouest.">
  <link rel="icon" type="image/jpeg" href="assets/img/logo/logo-monogramme.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            creme:   '#FFDEB3',
            cognac:  '#7F3301',
            marron:  '#4A1908',
            or:      '#D4A017',
            charbon: '#1C1410',
          },
          fontFamily: {
            display: ['"Bodoni Moda"', 'serif'],
            sans:    ['Jost', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-creme text-charbon font-sans antialiased">
    <script src="js/loader.js"></script>
    <script src="js/transitions.js"></script>


  <!-- ===== HEADER (identique à index.html) ===== -->
  <header id="header" class="bg-creme sticky top-0 z-50 transition-all duration-300">
    <div class="h-px bg-cognac opacity-30"></div>
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

      <nav class="hidden md:flex items-center gap-8">
        <a href="index.html" class="nav-link">Accueil</a>
        <a href="boutique.html" class="nav-link">Boutique</a>
        <a href="about.html" class="nav-link">À propos</a>
      </nav>

      <a href="index.html" class="md:absolute md:left-1/2 md:-translate-x-1/2">
        <img src="assets/img/logo/logo-cognac-transparent.png"
             alt="TONAFA" class="h-14 w-auto object-contain">
      </a>

      <div class="flex items-center gap-5 ml-auto">
                    <button id="search-btn" aria-label="Rechercher" class="icon-btn">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none"
               viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
          </svg>
        </button>
        <button id="cart-btn" aria-label="Panier" class="icon-btn relative">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none"
               viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"/>
          </svg>
          <span id="cart-count"
                class="absolute -top-2 -right-2 bg-cognac text-creme text-xs rounded-full
                       w-4 h-4 flex items-center justify-center hidden">0</span>
        </button>
        <button id="menu-btn" aria-label="Menu" class="icon-btn md:hidden">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none"
               viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="mobile-menu" class="hidden md:hidden bg-creme border-t border-cognac border-opacity-20">
      <nav class="flex flex-col px-6 py-4 gap-4">
        <a href="index.html" class="nav-link">Accueil</a>
        <a href="boutique.html" class="nav-link">Boutique</a>
        <a href="about.html" class="nav-link">À propos</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>
    </div>
    <div class="h-px bg-cognac opacity-30"></div>
  </header>
    <!-- ===== RECHERCHE ===== -->
  <div id="search-overlay" class="search-overlay hidden"></div>

  <div id="search-panel" class="search-panel hidden" role="dialog" aria-modal="true" aria-label="Rechercher un article">
    <div class="max-w-5xl mx-auto px-6 pt-8 pb-12">

      <!-- Champ de recherche -->
      <div class="flex items-center gap-4 border-b border-cognac border-opacity-40 pb-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-cognac flex-shrink-0" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
        </svg>
        <input id="search-input" type="search" autocomplete="off"
               placeholder="Rechercher un article, une couleur, une coupe..."
               class="search-input flex-1 min-w-0">
        <button id="search-close" class="icon-btn" aria-label="Fermer la recherche">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none"
               viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Suggestions -->
      <div class="flex flex-wrap items-center gap-2 mt-6">
        <span class="search-label mr-2">Suggestions</span>
        <button type="button" class="search-chip" data-terme="robe">Robe</button>
        <button type="button" class="search-chip" data-terme="chemise">Chemise</button>
        <button type="button" class="search-chip" data-terme="culotte">Culotte</button>
        <button type="button" class="search-chip" data-terme="short">Short</button>
        <button type="button" class="search-chip" data-terme="homme">Homme</button>
      </div>

      <!-- Résultats -->
      <p id="search-count" class="search-label mt-8"></p>
      <div id="search-results" class="grid grid-cols-2 md:grid-cols-4 gap-x-6 gap-y-8 mt-4"></div>

    </div>
  </div>


  <!-- ===== BANNIÈRE TITRE ===== -->
  <section class="py-20 text-center reveal">
    <p class="font-sans text-cognac text-xs tracking-[0.4em] uppercase mb-4">
      ✦ &nbsp; Collection 2026 &nbsp; ✦
    </p>
    <h1 class="font-display text-charbon text-5xl md:text-6xl font-normal mb-4">
      Boutique
    </h1>
        <div class="motif" data-motif="chevrons"></div>
  </section>


    <!-- ===== FILTRES ===== -->
  <section class="px-6 pb-10 reveal">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-center gap-3">
      <button class="filter-btn active" data-filter="tous">Tous</button>
      <button class="filter-btn" data-filter="femme">Femme</button>
      <button class="filter-btn" data-filter="homme">Homme</button>
      <button class="filter-btn" data-filter="haut">Hauts</button>
      <button class="filter-btn" data-filter="bas">Bas</button>
      <button class="filter-btn" data-filter="robe">Robes</button>
    </div>
  </section>


    <!-- ===== GRILLE PRODUITS ===== -->
  <!-- Les cartes sont créées automatiquement par js/boutique.js à partir de js/produits.js -->
  <section class="px-6 pb-24">
    <div class="max-w-7xl mx-auto">

      <p id="results-count"
         class="font-sans text-xs tracking-widest uppercase opacity-40 mb-10 text-center">
      </p>

      <div id="products-grid"
           class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-16 items-start">
      </div>

    </div>
  </section>


  <!-- ===== PANIER COULISSANT (copie identique) ===== -->
  <div id="cart-overlay"
       class="fixed inset-0 bg-charbon bg-opacity-50 z-40 hidden opacity-0 transition-opacity duration-300">
  </div>

  <div id="cart-drawer"
       class="fixed top-0 right-0 h-full w-full max-w-sm bg-creme z-50
              translate-x-full transition-transform duration-400 ease-in-out
              flex flex-col shadow-2xl">
    <div class="flex items-center justify-between px-6 py-5 border-b border-cognac border-opacity-20">
      <h2 class="font-display text-charbon text-2xl font-normal">Mon Panier</h2>
      <button id="cart-close" class="icon-btn">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div id="cart-items" class="flex-1 overflow-y-auto px-6 py-4">
      <div id="cart-empty" class="flex flex-col items-center justify-center h-full text-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-cognac opacity-20 mb-4"
             fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"/>
        </svg>
        <p class="font-sans text-charbon text-sm opacity-40 tracking-widest uppercase">
          Votre panier est vide
        </p>
      </div>
    </div>
    <div id="cart-footer" class="hidden px-6 py-6 border-t border-cognac border-opacity-20">
      <div class="flex justify-between items-center mb-6">
        <span class="font-sans text-xs tracking-[0.2em] uppercase text-charbon opacity-60">Total</span>
        <span id="cart-total" class="font-display text-charbon text-2xl">0 FCFA</span>
      </div>
      <button id="whatsapp-btn"
              class="w-full flex items-center justify-center gap-3
                     bg-[#25D366] text-white font-sans text-xs
                     tracking-[0.2em] uppercase py-4 px-6
                     transition-opacity duration-300 hover:opacity-90 cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/>
        </svg>
        Commander via WhatsApp
      </button>
      <button id="cart-clear"
              class="w-full text-center font-sans text-xs opacity-30 hover:opacity-60
                     tracking-widest uppercase mt-4 transition-opacity duration-300 cursor-pointer">
        Vider le panier
      </button>
    </div>
  </div>


    <!-- 1. Les données des articles -->
  <script src="js/produits.js"></script>
  <!-- 2. La création des cartes de la boutique -->
  <script src="js/boutique.js"></script>
  <script src="js/motifs.js"></script>
  <!-- 3. Le panier, les filtres, les animations -->
  <script src="js/script.js"></script>
</body>
</html>
